---
# EXAMPLE inventory (examples/inventory/hosts.yml).
# Copy it into your own project (e.g. inventory/hosts.yml) and replace the
# hosts with your own, or point at your inventory directly:
# ansible-playbook -i your/hosts.yml ...

all:
  vars:
    ansible_user: ansible
    # After the first run of the security role, the ssh port changes to
    # security_ssh_port (see group_vars/all.yml) — update ansible_port for
    # subsequent runs.
    # ansible_port: 22
  children:

    # All servers managed via the users/security/firewall/packages playbooks
    debian_servers:
      hosts:
        srv1.example.com:
        srv2.example.com:

    # Subset of servers that need Docker and docker-compose applications
    docker_hosts:
      hosts:
        srv1.example.com:
