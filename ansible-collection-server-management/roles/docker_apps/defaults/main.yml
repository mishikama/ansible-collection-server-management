---
# docker_apps is what the role actually loops over. By default it's built
# from two pieces so apps shared by every host (e.g. watchtower) don't have
# to be repeated per host:
#   - docker_apps_common — set in group_vars (e.g. group_vars/docker/docker_apps.yml),
#     applies to every host in the group
#   - docker_apps_extra  — set in host_vars/<host>/docker_apps.yml, that host's own apps
# A host with no docker_apps_extra still gets docker_apps_common. You can
# still set docker_apps directly (in group_vars/host_vars) to bypass this
# split entirely — that takes precedence over this default expression.
docker_apps_common: []
docker_apps_extra: []
docker_apps: "{{ docker_apps_common + docker_apps_extra }}"
# Item format (see the example in inventory/group_vars/all.yml):
# - name: myapp
#   state: started        # started|stopped|absent
#   pull: missing          # always|missing|never
#   remove_orphans: true
#   compose_src: "{{ playbook_dir }}/../files/docker-compose/myapp"   # directory with docker-compose.yml
#     # can also be a list of directories, copied in order into the same
#     # destination — later directories add/overwrite files from earlier
#     # ones. Useful for layering a shared base (e.g. a common compose.yaml)
#     # with host-specific files (configs, secrets) without needing a
#     # symlink on disk to fake a single merged directory.
#   env_file: ""           # optional, path to .env on the control machine

docker_apps_base_dir: /opt/docker-apps   # where compose files are deployed on the server
